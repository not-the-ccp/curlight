name: Build release candidate

# Deliberately builds artifacts only: no automatic PyPI publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests tools examples && mypy
      - run: CURLIGHT_BACKEND=ctypes python -m pytest
      - run: CURLIGHT_BACKEND=cffi python -m pytest
      - run: python -m build && python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/*
