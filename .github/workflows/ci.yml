name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests tools examples
      - run: ruff format --check src tests tools examples
      - run: mypy
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        backend: [ctypes, cffi]
        include:
          - os: macos-latest
            python: '3.13'
            backend: ctypes
          - os: macos-latest
            python: '3.13'
            backend: cffi
    runs-on: ${{ matrix.os }}
    env:
      CURLIGHT_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4t64 openssl
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest --cov=curlight --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.backend }}
          path: coverage.xml

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - run: |
          python -m venv /tmp/curlight-wheel
          /tmp/curlight-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/curlight-wheel/bin/python -c 'import curlight; assert curlight.backend == "ctypes"; print(curlight.version())'
          /tmp/curlight-wheel/bin/pip check
