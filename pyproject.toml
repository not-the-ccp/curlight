[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "curlight"
version = "0.1.0"
description = "Pythonic HTTP sessions and safe, typed libcurl bindings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "curlight contributors"}]
keywords = ["curl", "libcurl", "http", "asyncio", "bindings"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
cffi = ["cffi>=1.16"]
dev = ["cffi>=1.16", "pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.11", "mypy>=1.14", "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://github.com/not-the-ccp/curlight"
Repository = "https://github.com/not-the-ccp/curlight"
Issues = "https://github.com/not-the-ccp/curlight/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/curlight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src/curlight"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["cffi"]
ignore_missing_imports = true
